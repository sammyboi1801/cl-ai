[project]
name = "cl-ai"
version = "0.1.0.dev0"
description = "Natural-language command completion for your shell. Tab, cycle, run."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Apache-2.0" }

# The core is deliberately dependency-light: it is imported by a daemon that
# has to start fast, and every dependency is startup cost.
dependencies = []

[project.optional-dependencies]
# The default planner. Kept optional so the LLM stays swappable in packaging,
# not just in the type system.
needle = ["cactus-needle>=3.0.1"]
dev = ["pytest", "hypothesis", "ruff", "mypy"]

[project.scripts]
cl-ai = "cl_ai.cli:main"
cl-aid = "cl_ai.daemon.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The shell adapters ship as data files and are installed by `cl-ai init`.
"cl_ai.shell" = ["powershell/*", "zsh/*", "bash/*", "fish/*"]
# Without this marker, type checkers ignore our annotations in a consumer's
# project -- the hints exist but are invisible where they would be useful.
"cl_ai" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
# Strict, because the package ships py.typed. That marker tells a consumer's
# type checker to trust these annotations inside their own project, so an
# unchecked annotation here is not a private style matter -- it is a claim we
# make to every installer. Without this gate the hints were decoration.
strict = true
# The floor declared in requires-python. Checking under the OLDEST supported
# interpreter is the point: newer syntax that 3.10 cannot parse is exactly the
# breakage a developer on 3.13 will not notice.
python_version = "3.10"
files = ["src"]

# Tests are deliberately excluded. A transitively installed third-party stub
# (numpy, via hypothesis) fails to parse under the 3.10 target, and that has
# nothing to do with our code. src is the surface py.typed advertises.

[[tool.mypy.overrides]]
module = ["cactus_needle.*"]
ignore_missing_imports = true
